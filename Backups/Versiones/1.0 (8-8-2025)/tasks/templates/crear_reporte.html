<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Reporte</title>
    <style>
        /* Estilos generales */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor del formulario */
        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* Estilos para el grid de dos columnas */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Estilos para las etiquetas */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        /* Estilos para los campos de entrada */
        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #007bff;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Estilos para la sección de imágenes */
        .imagenes-section {
            margin-top: 20px;
        }

        .imagenes-section label {
            font-size: 18px;
            margin-bottom: 15px;
            display: block;
        }

        .imagenes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .imagenes-grid input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Estilos para el botón */
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Estilos responsivos */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .imagenes-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 24px;
            }

            button {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .imagenes-grid {
                grid-template-columns: 1fr;
            }

            .form-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Formulario de Incidencias</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <!-- Sección de campos en dos columnas -->
            <div class="form-grid">
                <div>
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>  
                <div>
                    <label for="folio">Folio:</label>
                    <input type="text" id="folio" name="folio" required>
                </div>
                <div>
                    <label for="clave">Clave:</label>
                    <input type="text" id="clave" name="clave" required>
                </div>
                <div>
                    <label for="administrador">Administrador:</label>
                    <input type="text" id="administrador" name="administrador" required>
                </div>
                <div>
                    <label for="operador">Operador:</label>
                    <input type="text" id="operador" name="operador" required>
                </div>
                <div>
                    <label for="damage_vehiculo">Daño Vehículo:</label>
                    <input type="text" id="damage_vehiculo" name="damage_vehiculo" required>
                </div>
                <div>
                    <label for="damage_bus">Daño Vehiculo ATB:</label>
                    <input type="text" id="damage_bus" name="damage_bus" required>
                </div>
                <div>
                    <label for="damage_others">Daño Terceros 1:</label>
                    <input type="text" id="damage_others" name="damage_others" required>
                </div>
                <div>
                    <label for="damage_others2">Daño Terceros 2:</label>
                    <input type="text" id="damage_others2" name="damage_others2" required>
                </div>
                <div>
                    <label for="damage_others3">Daño Terceros 3:</label>
                    <input type="text" id="damage_others3" name="damage_others3" required>
                </div>
                <div>
                    <label for="ubicacion">Ubicación del percance:</label>
                    <input type="text" id="ubicacion" name="ubicacion" required>
                </div>
            </div>

            <!-- Campos de texto grandes -->
            <div>
                <label for="observaciones">Observaciones:</label>
                <textarea id="observaciones" name="observaciones" required></textarea>
            </div>

            <!-- Campos de Selección brou-->
            <div>
                <label for="responsabilidad">Responsabilidad:</label>
                <input type="radio" name="responsabilidad" value="Si" checked> Con responsabilidad
                <input type="radio" name="responsabilidad" value="No" checked> Sin responsabilidad
            </div>

            <div>
                <label for="intervino">Qualitas:</label>
                <input type="radio" name="intervino" value="Si Intervino" checked> Intervino
                <input type="radio" name="intervino" value="No intervino" checked> No intervino
            </div>

            <!-- Sección de imágenes -->
            <div class="imagenes-section">
                <label>Subir imágenes:</label>
                <div class="imagenes-grid">
                    <input type="file" id="imagen1" name="imagen1" accept="image/*">
                    <input type="file" id="imagen2" name="imagen2" accept="image/*">
                    <input type="file" id="imagen3" name="imagen3" accept="image/*">
                    <input type="file" id="imagen4" name="imagen4" accept="image/*">
                    <input type="file" id="imagen5" name="imagen5" accept="image/*">
                    <input type="file" id="imagen6" name="imagen6" accept="image/*">
                </div>
            </div>

            <!-- Botón de enviar -->
            <button type="submit">Crear Reporte</button>
        </form>
    </div>
    <a href="/" class="btn-regresar">Regresar</a>
</body>
</html>
