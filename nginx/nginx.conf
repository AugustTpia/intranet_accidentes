upstream django {
    server web:8000;
}

# 1. SERVIDOR HTTPS (Seguro)
server {
    listen 443 ssl;
    server_name atb.intranet.accidentes 172.16.254.181 localhost;

    # Ruta dentro del contenedor Nginx donde se montarán los certificados
    ssl_certificate /etc/nginx/certs/atb.intranet.accidentes+1.pem;
    ssl_certificate_key /etc/nginx/certs/atb.intranet.accidentes+1-key.pem;

    # Configuración de seguridad SSL recomendada
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Permite archivos de hasta 100MB
    client_max_body_size 100M;

    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # Indica a Django que viene por HTTPS
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}

# 2. REDIRECCIÓN DE HTTP A HTTPS
server {
    listen 80;
    server_name atb.intranet.accidentes 172.16.254.181 localhost;

    return 301 https://$host$request_uri;
}