<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Beta Formulario Administrador</title>
  <style>
    /* Estilos generales */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor del formulario */
        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* Estilos para el grid de dos columnas */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Estilos para las etiquetas */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        /* Estilos para los campos de entrada */
        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #007bff;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Estilos para la sección de imágenes */
        .imagenes-section {
            margin-top: 20px;
        }

        .imagenes-section label {
            font-size: 18px;
            margin-bottom: 15px;
            display: block;
        }

        .imagenes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .imagenes-grid input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Estilos para el botón */
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .btn-regresar {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #6c757d;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
           <!--  width: 100%; -->
            transition: background-color 0.3s ease;
        }

        /* Estilos responsivos */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .imagenes-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 24px;
            }

            button {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .imagenes-grid {
                grid-template-columns: 1fr;
            }

            .form-container {
                padding: 20px;
            }
        }
        div.floating-bar{
          background: #0066c5ff;
          margin: 0;
          /*Bordes uniformes 50 px*/
          /*Bordes redondeados parte inferior */
          border-radius: 0 0 50px 50px; 
          box-shadow: 0 0px 14px -7px #76888aff;
          width: 77%;
          top: 0;
          position: fixed;
          z-index: 100;
        }
        /*Centrado de TopBar */
        div.floating-bar h3{
          display: block;
          margin: 0 0,5em;
          text-align: center; 
        }

  </style>
</head>
<body>
    <!--Top Bar-->
    <div class="floating-bar">
      <h3>Top Menú</h3>
      <a href="/ver_listas/">Listas de Nombres</a>
      <!--<a href="/">Example</a>-->
    </div>
    <div class="form-container">
        <!--Dos formularios-->
        <!--1.- Lista de Operadores-->
        <!--2.- Lista de Administradores-->
      <h1>Agregar Administrador</h1> 
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-grid">
            <div>
                <label for="nombre_Admin">Nombre:</label>
                <input type="text" id="nombre_Admin" name="nombre_Admin" placeholder="Nombre" style="text-transform: uppercase;" required>
            </div>
            <div>
                <label for="alias_Admin">Alias:</label>
                <input type="text" id="alias_Admin" name="alias_Admin"  placeholder="Alias, sobre nombre, apodo, etc." style="text-transform: uppercase;">
            </div>
            <div>
                <label for="comentario_Admin">COMENTARIO:</label>
                <input type="text" id="comentario_Admin" name="comentario_Admin" placeholder="Comentario al respecto" style="text-transform: uppercase;">
            </div>
        </div>

        <!--{{ form.as_p}}

        <label for="nombre">NOMBRE:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre" style="text-transform: uppercase;" required>
        
        <label for="alias">ALIAS:</label>
        <input type="text" id="alias" name="alias" placeholder="Alias, sobre nombre, etc." style="text-transform: uppercase;">
  
        <label for='comentario'>Comentario:</label>
        <textarea id='comentario' name='comentario' placeholder='Comentario sobre la persona'></textarea>
        -->
        <button type="submit">Guardar</button>
      </form>

    </div>
    <a href="/" class="btn-regresar">Regresar</a>


</body>
</html>
