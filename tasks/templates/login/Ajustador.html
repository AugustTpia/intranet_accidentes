{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="icon" href="https://media.cylex.mx/companies/1167/0462/logo/logo8853855.jpg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href ="{% static 'tasks/css/login_ad.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="login-form-container">
            <div class="login-form">
                <img src="https://media.cylex.mx/companies/1167/0462/logo/logo8853855.jpg" alt="Logo" class="form-logo">
                <h1>Inicio de Sesión</h1>
                <p>Ingresa tus credenciales para acceder al sistema</p>

                <form action="/login/" method="post">
                    {% csrf_token %}
                    <div class="input-group">
                        <label for="username">Usuario</label>
                        <div class="input-field">
                            <i class="fas fa-user"></i>
                            <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <div class="input-field">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                        </div>
                    </div>

                    <button type="submit" class="login-btn">
                        <i class="fas fa-sign-in-alt"></i> Iniciar sesión
                    </button>
                </form>

                <p class="footer-text">© 2026 Autotransportes Banderilla. Todos los derechos reservados.</p> 
            </div>
        </div>
    </div>
</body>
</html>
